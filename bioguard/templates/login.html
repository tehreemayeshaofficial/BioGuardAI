<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · {{ app_name }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>&#129512;</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <form class="auth-card" method="post" action="{{ url_for('auth.login', next=request.args.get('next')) }}" novalidate>
      <div class="auth-brand">
        <span class="brand-mark" aria-hidden="true">B</span>
        <span class="auth-brand-text">
          <strong>{{ app_name }}</strong>
          <small>{{ app_tagline }}</small>
        </span>
      </div>

      <h1>Sign in</h1>
      <p class="auth-sub">{{ official_name }}</p>

      {% if error %}<div class="auth-error" role="alert">{{ error }}</div>{% endif %}

      <label for="a-hospital">Hospital Name
        <input id="a-hospital" name="hospital_name" type="text" autocomplete="organization"
               value="{{ hospital_name }}" placeholder="e.g. St. Mary's General">
      </label>
      <label for="a-user">Username
        <input id="a-user" name="username" type="text" autocomplete="username"
               value="{{ username }}" placeholder="email or username" required>
      </label>
      <label for="a-pass">Password
        <input id="a-pass" name="password" type="password" autocomplete="current-password" required>
      </label>

      <button class="auth-btn" type="submit">Login</button>

      <p class="auth-alt">Need an account?
        <a href="{{ url_for('auth.register') }}">Create Account</a></p>
    </form>
  </main>
</body>
</html>
